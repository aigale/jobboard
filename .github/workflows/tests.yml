# Runs the test suite on GitHub every time you push, and shows a green check or red X.
# It runs twice: once on SQLite (like your computer) and once on Postgres (like your server).
name: Tests

on:
  push:
  pull_request:

jobs:
  sqlite:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: pytest -q

  postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: sinag
          POSTGRES_PASSWORD: sinag
          POSTGRES_DB: sinagtest
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U sinag" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql+psycopg://sinag:sinag@localhost:5432/sinagtest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: pytest -q
